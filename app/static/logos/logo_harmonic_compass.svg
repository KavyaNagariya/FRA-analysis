<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="hc-terracotta" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E08365"/>
      <stop offset="100%" stop-color="#B85E42"/>
    </linearGradient>
    <linearGradient id="hc-charcoal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D2B28"/>
      <stop offset="100%" stop-color="#141312"/>
    </linearGradient>
  </defs>

  <!-- Facet 1: North-West (Terracotta Light) -->
  <polygon points="50,6 50,50 18,50" fill="#CC785C"/>

  <!-- Facet 2: South-East (Terracotta Deep) -->
  <polygon points="50,94 50,50 82,50" fill="url(#hc-terracotta)"/>

  <!-- Facet 3: North-East (Deep Charcoal) -->
  <polygon points="50,6 50,50 82,50" fill="#1F1E1D"/>

  <!-- Facet 4: South-West (Deep Charcoal Inset) -->
  <polygon points="50,94 50,50 18,50" fill="url(#hc-charcoal)"/>

  <!-- Central Resonance Aperture -->
  <circle cx="50" cy="50" r="7" fill="#FAF8F5"/>
  <circle cx="50" cy="50" r="4.5" fill="#CC785C"/>

  <!-- Horizontal Harmonic Sine Pulse Trace Across Center -->
  <path d="M 6,50 Q 18,44 28,50 T 48,50 Q 50,50 52,50 T 72,50 Q 82,56 94,50" 
        fill="none" stroke="#CC785C" stroke-width="2.5" stroke-linecap="round" opacity="0.85"/>
  
  <!-- Subtle Cardinal Frequency Ticks -->
  <line x1="50" y1="2" x2="50" y2="5" stroke="#CC785C" stroke-width="2" stroke-linecap="round"/>
  <line x1="50" y1="95" x2="50" y2="98" stroke="#CC785C" stroke-width="2" stroke-linecap="round"/>
  <line x1="2" y1="50" x2="5" y2="50" stroke="#1F1E1D" stroke-width="2" stroke-linecap="round"/>
  <line x1="95" y1="50" x2="98" y2="50" stroke="#1F1E1D" stroke-width="2" stroke-linecap="round"/>
</svg>
